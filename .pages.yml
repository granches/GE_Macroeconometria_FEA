media:
  input: media
  output: /media
content:
  - name: informacoes
    label: Informações gerais e conferência
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: hero_label
        label: Identificação acima do título
        type: string
      - name: hero_description
        label: Descrição da abertura
        type: text
      - name: about_text
        label: Sobre o grupo
        type: text
      - name: meeting_schedule
        label: Horário dos encontros
        type: string
      - name: meeting_place
        label: Local dos encontros
        type: string
      - name: who_can_join
        label: Quem pode participar
        type: text
      - name: conference_date
        label: Conferência — mês ou data
        type: string
      - name: conference_description
        label: Texto da conferência
        type: text
      - name: contact_intro
        label: Texto de contato
        type: text
      - name: contact_email
        label: E-mail
        type: string
      - name: contact_address
        label: Endereço (uma linha por trecho)
        type: text
  - name: membros
    label: Membros
    type: file
    path: content/members.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: name
        label: Nome
        type: string
        required: true
      - name: group
        label: Grupo
        type: select
        required: true
        options:
          values:
            - name: doutorado
              label: Doutorado
            - name: mestrado
              label: Mestrado
      - name: advisor
        label: Nome do orientador
        type: string
        description: Deixe entre colchetes enquanto não houver confirmação.
      - name: lattes_url
        label: Endereço do Currículo Lattes (https://...)
        type: string
  - name: publicacoes
    label: Pesquisas e publicações
    type: file
    path: content/publications.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: year
        label: Ano (texto)
        type: string
      - name: title
        label: Título do trabalho
        type: string
        required: true
      - name: authors
        label: Autores e referência
        type: text
      - name: type
        label: Tipo de publicação
        type: select
        options:
          values:
            - name: Dissertação de mestrado
              label: Dissertação de mestrado
            - name: Tese de doutorado
              label: Tese de doutorado
            - name: Artigo publicado
              label: Artigo publicado
            - name: Working paper
              label: Working paper
            - name: Outro
              label: Outro
      - name: url
        label: Link do artigo ou PDF (https://...)
        type: string
  - name: eventos
    label: Eventos — próximos e passados
    type: file
    path: content/events.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: section
        label: Exibir em
        type: select
        required: true
        description: Encontros com data e hora definidas passam automaticamente ao histórico no site; este campo permanece para ajustes manuais.
        options:
          values:
            - name: proximo
              label: Eventos próximos
            - name: passado
              label: Eventos passados
      - name: date_display
        label: Data como deve aparecer no site
        type: string
        description: Exemplo 12/11/2026, 10h ou TBA.
      - name: sort_date
        label: Data para ordenar (opcional)
        type: date
        default: ''
        description: Use em eventos com data definida. Não precisa preencher para eventos TBA ou Anterior.
        options:
          format: yyyy-MM-dd
      - name: start_at
        label: Data e hora do encontro (para destaque automático)
        type: date
        default: ''
        description: Horário de São Paulo. O próximo encontro é escolhido por este campo. Deixe vazio se for TBA.
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - name: category
        label: Categoria
        type: select
        options:
          values:
            - name: Grupo de leitura
              label: Grupo de leitura
            - name: Seminário interno
              label: Seminário interno
            - name: Palestra convidada
              label: Palestra convidada
            - name: Outro
              label: Outro
      - name: title
        label: Título do encontro ou artigo
        type: string
        required: true
      - name: details
        label: Detalhes, apresentador e local
        type: text
      - name: url
        label: Link do artigo ou inscrição (https://...)
        type: string
      - name: link_label
        label: Texto do link
        type: string
      - name: slides_url
        label: Link dos slides (relativo ao site ou https://...)
        type: string
        description: 'Ex.: ./materiais/2026/2026-11-05-nakamura-steinsson/slides.pdf'
